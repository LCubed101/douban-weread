[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douban-weread"
version = "0.1.0"
description = "Align Douban Want-to-Read editions with editions available on WeRead."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "douban-weread contributors"}]
dependencies = [
  "lark-channel-sdk>=1.0,<2",
  "lark-oapi>=1.4,<2",
]

[project.scripts]
douban-weread = "douban_weread.entrypoint:main"
douban-weread-ui = "douban_weread.web_ui:main"
douban-weread-feishu = "douban_weread.feishu_bot:main"

[tool.setuptools.packages.find]
include = ["douban_weread*"]
